<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaSoft 1.0 - Gestion RH & Finances</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .carte { @apply bg-white rounded-xl border border-slate-200 p-5 shadow-sm; }
    .champ { @apply w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500; }
    .etiq { @apply block text-xs font-semibold text-slate-700 mb-1; }
    .btn { @apply bg-blue-600 text-white font-semibold text-sm px-4 py-2 rounded-lg hover:bg-blue-700 transition disabled:opacity-50; }
    .btn-clair { @apply bg-slate-100 text-slate-700 font-semibold text-sm px-4 py-2 rounded-lg hover:bg-slate-200 transition; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

<div id="app" class="p-4 md:p-8">

  <!-- VUE CONNEXION -->
  <div id="vue-login" class="max-w-md mx-auto my-12 carte">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-blue-600">NovaSoft</h1>
      <p class="text-xs text-slate-500 mt-1">Connexion à votre espace entreprise</p>
    </div>
    <form id="form-login" class="space-y-4">
      <div>
        <label class="etiq" for="login-email">Email</label>
        <input id="login-email" type="email" required class="champ" placeholder="nom@entreprise.com">
      </div>
      <div>
        <label class="etiq" for="login-mdp">Mot de passe</label>
        <input id="login-mdp" type="password" required class="champ">
      </div>
      <button id="btn-login" class="btn w-full" type="submit">Se connecter</button>
      <p id="msg-login" class="text-sm hidden"></p>
    </form>
  </div>

  <!-- VUE APPLICATION -->
  <div id="vue-app" class="hidden">
    <header class="max-w-3xl mx-auto flex items-center justify-between py-4 mb-6 border-b border-slate-200">
      <div class="flex items-center gap-2">
        <span class="font-bold text-xl text-blue-600">NovaSoft</span>
        <span class="px-2 py-0.5 text-xs font-semibold bg-blue-50 text-blue-700 rounded-md">1.0</span>
      </div>
      <div class="text-right">
        <p id="who" class="text-sm font-semibold"></p>
        <p id="role" class="text-xs text-slate-500"></p>
      </div>
    </header>

    <main class="max-w-3xl mx-auto space-y-6">

      <!-- Mon Dossier -->
      <section id="sec-dossier" class="carte">
        <h2 class="font-bold text-lg">Mon dossier</h2>
        <div id="dossier-info" class="text-sm text-slate-600 mt-2"></div>
      </section>

      <!-- Demande de congé -->
      <section id="sec-conge" class="carte hidden">
        <h2 class="font-bold text-lg">Demander un congé</h2>
        <form id="form-conge" class="mt-4 space-y-4">
          <div>
            <label class="etiq" for="c-type">Type de congé</label>
            <select id="c-type" class="champ">
              <option value="annuel">Congé annuel</option>
              <option value="maladie">Maladie</option>
              <option value="maternite_paternite">Maternité / paternité</option>
              <option value="sans_solde">Sans solde</option>
              <option value="autre">Autre</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="etiq" for="c-debut">Du</label>
              <input id="c-debut" type="date" required class="champ">
            </div>
            <div>
              <label class="etiq" for="c-fin">Au</label>
              <input id="c-fin" type="date" required class="champ">
            </div>
          </div>
          <div>
            <label class="etiq" for="c-motif">Motif (facultatif)</label>
            <textarea id="c-motif" rows="2" class="champ"></textarea>
          </div>
          <button class="btn w-full" type="submit">Envoyer la demande</button>
          <p id="msg-conge" class="text-sm hidden"></p>
        </form>
      </section>

      <!-- Mes demandes -->
      <section id="sec-mes" class="carte hidden">
        <h2 class="font-bold text-lg">Mes demandes de congés</h2>
        <div id="liste-mes" class="mt-3 divide-y divide-slate-100"></div>
      </section>

      <!-- Traitement demandes (Admin) -->
      <section id="sec-traiter" class="carte hidden">
        <h2 class="font-bold text-lg">Demandes à traiter</h2>
        <div id="liste-traiter" class="mt-3 divide-y divide-slate-100"></div>
        <p id="msg-traiter" class="text-sm hidden mt-3"></p>
      </section>

      <!-- FORMULAIRE COMPLET AJOUT EMPLOYÉ (Admin) -->
      <section id="sec-employe" class="carte hidden">
        <h2 class="font-bold text-lg">Ajouter un employé (Fiche complète)</h2>
        <p class="text-xs text-slate-500 mt-1 mb-4">Renseignez la fiche complète du collaborateur.</p>
        
        <form id="form-employe" class="space-y-4">
          <div>
            <label class="etiq" for="e-photo">Photo d'identité</label>
            <input id="e-photo" type="file" accept="image/*" class="champ">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="etiq" for="e-prenom">Prénom</label>
              <input id="e-prenom" required class="champ">
            </div>
            <div>
              <label class="etiq" for="e-nom">Nom</label>
              <input id="e-nom" required class="champ">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="etiq" for="e-matricule">Matricule</label>
              <input id="e-matricule" required class="champ">
            </div>
            <div>
              <label class="etiq" for="e-poste">Poste / Fonction</label>
              <input id="e-poste" class="champ">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="etiq" for="e-telephone">Téléphone</label>
              <input id="e-telephone" type="tel" placeholder="+229..." class="champ">
            </div>
            <div>
              <label class="etiq" for="e-date-embauche">Date d'embauche</label>
              <input id="e-date-embauche" type="date" class="champ">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="etiq" for="e-type-contrat">Type de contrat</label>
              <select id="e-type-contrat" class="champ">
                <option value="CDI">CDI</option>
                <option value="CDD">CDD</option>
                <option value="Stage">Stage</option>
                <option value="Essai">Période d'essai</option>
              </select>
            </div>
            <div>
              <label class="etiq" for="e-dep">Département</label>
              <input id="e-dep" class="champ">
            </div>
          </div>

          <div>
            <label class="etiq" for="e-email">Email du compte (facultatif)</label>
            <input id="e-email" type="email" class="champ">
          </div>

          <button class="btn w-full" type="submit">Enregistrer l'employé</button>
          <p id="msg-employe" class="text-sm hidden"></p>
        </form>
      </section>

      <button id="btn-logout" class="btn-clair w-full mt-6" type="button">Se déconnecter</button>
    </main>
  </div>

</div>

<script>
  const SUPABASE_URL = 'https://tnsvcvbrybzelfxxhttn.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_R2Jh5Ta4PT2K-3z0MlLtCg_AdXHtXvh';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtDate = (d) => new Date(d + 'T00:00:00').toLocaleDateString('fr-FR');
  const ROLES = { admin: 'Administrateur', comptable: 'Comptable', employe: 'Employé' };

  function msg(id, texte, ok) {
    const el = $(id);
    el.textContent = texte;
    el.className = 'text-sm ' + (ok ? 'text-emerald-700' : 'text-rose-600');
  }
  function clearMsg(id) { $(id).className = 'text-sm hidden'; }
  function show(id, visible) { $(id).classList.toggle('hidden', !visible); }

  let me = null;
  let emp = null;

  function showLogin() { show('vue-app', false); show('vue-login', true); }

  $('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMsg('msg-login');
    const btn = $('btn-login');
    btn.disabled = true;
    try {
      const { error } = await db.auth.signInWithPassword({
        email: $('login-email').value.trim(),
        password: $('login-mdp').value
      });
      if (error) { msg('msg-login', 'Email ou mot de passe incorrect.', false); return; }
      await loadApp();
    } catch (err) {
      msg('msg-login', 'Connexion impossible.', false);
    } finally {
      btn.disabled = false;
    }
  });

  $('btn-logout').addEventListener('click', async () => {
    await db.auth.signOut();
    me = null; emp = null;
    showLogin();
  });

  async function loadApp() {
    const { data: { user } } = await db.auth.getUser();
    if (!user) { showLogin(); return; }

    const { data, error } = await db.from('utilisateurs').select('id,nom,email,role').eq('id', user.id).maybeSingle();
    if (error || !data) {
      await db.auth.signOut();
      showLogin();
      msg('msg-login', "Ce compte n'est pas enregistré.", false);
      return;
    }
    me = data;
    $('who').textContent = me.nom;
    $('role').textContent = ROLES[me.role] || me.role;

    const r = await db.from('employes').select('*').eq('utilisateur_id', me.id).maybeSingle();
    emp = r.data || null;

    renderDossier();
    const estAdmin = me.role === 'admin';
    show('sec-conge', !!emp);
    show('sec-mes', !!emp);
    show('sec-traiter', estAdmin);
    show('sec-employe', estAdmin);

    show('vue-login', false);
    show('vue-app', true);
  }

  function renderDossier() {
    const info = $('dossier-info');
    if (emp) {
      const photoHtml = emp.photo_url ? `<img src="${esc(emp.photo_url)}" class="w-16 h-16 rounded-full object-cover mb-3">` : '';
      info.innerHTML = photoHtml
        + '<p class="font-semibold text-base">' + esc(emp.prenom + ' ' + emp.nom) + '</p>'
        + '<p class="text-xs text-slate-500">' + esc(emp.poste || 'Non spécifié') + ' · ' + esc(emp.type_contrat || 'CDI') + '</p>'
        + '<p class="text-xs text-slate-500 mt-1">Matricule: ' + esc(emp.matricule) + ' · Tél: ' + esc(emp.telephone || 'Non renseigné') + '</p>';
    } else if (me.role === 'admin') {
      info.textContent = "Vous n'avez pas de dossier employé personnel.";
    } else {
      info.textContent = "Dossier non encore créé par l'administrateur.";
    }
  }

  // Enregistrement de l'employé avec photo
  $('form-employe').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMsg('msg-employe');

    const file = $('e-photo').files[0];
    let photoUrl = null;

    if (file) {
      const ext = file.name.split('.').pop();
      const path = `employes/${Date.now()}.${ext}`;
      const { error: upErr } = await db.storage.from('avatars').upload(path, file);
      if (upErr) {
        msg('msg-employe', "Erreur envoi photo: " + upErr.message, false);
        return;
      }
      const { data: urlData } = db.storage.from('avatars').getPublicUrl(path);
      photoUrl = urlData.publicUrl;
    }

    const payload = {
      prenom: $('e-prenom').value.trim(),
      nom: $('e-nom').value.trim(),
      matricule: $('e-matricule').value.trim(),
      poste: $('e-poste').value.trim(),
      telephone: $('e-telephone').value.trim(),
      date_embauche: $('e-date-embauche').value || null,
      type_contrat: $('e-type-contrat').value,
      departement: $('e-dep').value.trim(),
      photo_url: photoUrl
    };

    const { error } = await db.from('employes').insert([payload]);
    if (error) {
      msg('msg-employe', "Erreur enregistrement: " + error.message, false);
    } else {
      msg('msg-employe', "Employé créé avec succès !", true);
      $('form-employe').reset();
    }
  });

  loadApp();
</script>
</body>
</html>
